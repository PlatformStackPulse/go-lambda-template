AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AWS SAM template for local and quick-start deployment of the Go Lambda API template.

Globals:
  Function:
    Runtime: provided.al2023
    Handler: bootstrap
    Timeout: 10
    MemorySize: 512
    Architectures:
      - arm64
    Environment:
      Variables:
        APP_NAME: go-lambda-template
        APP_ENV: dev
        APP_VERSION: sam-local
        DEBUG: "true"
        API_BASE_PATH: /hello
        API_SOURCE_LABEL: sam-local
        DYNAMODB_REQUESTS_TABLE_NAME:
          Ref: RequestsTable
        SSM_PARAMETER_PREFIX: /go-lambda-template/dev
        APP_CONFIG_PARAMETER_NAME:
          Ref: AppConfigParameter
        S3_SOURCE_BUCKET_NAME: ""
        S3_SOURCE_KEY_PREFIX: ""
        S3_TARGET_BUCKET_NAME: ""
        S3_TARGET_KEY_PREFIX: ""
        KMS_KEY_ARN: ""
        POSTGRES_ENABLED: "false"
        POSTGRES_DATABASE_NAME: app
        POSTGRES_CLUSTER_ARN: ""
        POSTGRES_SECRET_ARN: ""

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default

  RequestsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: request_id
          AttributeType: S
      KeySchema:
        - AttributeName: request_id
          KeyType: HASH

  AppConfigParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /go-lambda-template/dev/app-config
      Type: String
      Value: '{"api.base_path":"/hello","dynamodb.requests_table_name":"go-lambda-template-dev-requests","platform.environment":"dev","platform.name":"go-lambda-template","platform.version":"sam-local","sample.greeting.prefix":"Hello","s3.source.bucket":"","s3.source.key_prefix":"","s3.target.bucket":"","s3.target.key_prefix":"","kms.key_arn":""}'

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../dist
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Sid: DynamoDBAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                Fn::GetAtt:
                  - RequestsTable
                  - Arn
            - Sid: ReadAppConfigParameter
              Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
                - ssm:GetParametersByPath
              Resource:
                Fn::Sub: arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/go-lambda-template/dev/app-config
      Events:
        SampleBase:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Method: GET
            Path: /hello
        SampleByName:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Method: GET
            Path: /hello/{name}
        Health:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Method: GET
            Path: /health
        Ready:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Method: GET
            Path: /ready

Outputs:
  LocalApiUrl:
    Description: Local or deployed API endpoint
    Value:
      Fn::Sub: https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
